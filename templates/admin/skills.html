{% extends 'admin/base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h2>Manage Skills</h2>
  <form action="{{ url_for('admin_add_skill') }}" method="POST" class="d-flex">
    <input type="text" name="name" class="form-control me-2" placeholder="New Skill Name" required>
    <button type="submit" class="btn btn-primary">Add</button>
  </form>
</div>

<div class="card shadow-sm">
  <div class="card-body">
    <table class="table table-hover">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for skill in skills %}
        <tr>
          <td>{{ skill.id }}</td>
          <td>{{ skill.name }}</td>
          <td>
            <a href="{{ url_for('admin_delete_skill', id=skill.id) }}" class="btn btn-sm btn-danger" onclick="return confirm('Delete this skill?');">Delete</a>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
