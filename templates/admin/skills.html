{% extends 'admin/base.html' %}
{% block content %}
<div class="page-header">
  <h2><i class="bi bi-tools me-2 text-primary"></i>Manage Skills</h2>
  <form action="{{ url_for('admin_add_skill') }}" method="POST" class="d-flex gap-2">
    <input type="text" name="name" class="form-control" placeholder="New skill name…" required style="width: 220px;">
    <button type="submit" class="btn btn-primary px-4">
      <i class="bi bi-plus-lg me-1"></i>Add
    </button>
  </form>
</div>

<div class="admin-card">
  <div class="card-header"><i class="bi bi-list-check me-2"></i>All Skills</div>
  <div class="card-body p-0">
    <table class="table table-hover mb-0">
      <thead>
        <tr>
          <th>#</th>
          <th>Skill Name</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for skill in skills %}
        <tr>
          <td class="text-muted">{{ skill.id }}</td>
          <td>
            <span class="badge bg-light text-dark border px-3 py-2" style="font-size:13.5px; border-radius:8px;">
              {{ skill.name }}
            </span>
          </td>
          <td>
            <a href="{{ url_for('admin_delete_skill', id=skill.id) }}" class="btn btn-sm btn-outline-danger"
               onclick="return confirm('Delete {{ skill.name }}?');">
              <i class="bi bi-trash"></i> Delete
            </a>
          </td>
        </tr>
        {% else %}
        <tr><td colspan="3" class="text-center text-muted py-4">No skills yet.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
