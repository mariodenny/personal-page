{% extends 'admin/base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h2>Manage Projects</h2>
  <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addProjectModal">Add Project</button>
</div>

<div class="card shadow-sm">
  <div class="card-body">
    <table class="table table-hover">
      <thead>
        <tr>
          <th>ID</th>
          <th>Title</th>
          <th>Category</th>
          <th>Date</th>
          <th>Icon</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for project in projects %}
        <tr>
          <td>{{ project.id }}</td>
          <td>{{ project.title }}</td>
          <td><span class="badge bg-secondary">{{ project.category }}</span></td>
          <td>{{ project.date }}</td>
          <td><i class="bi {{ project.icon_class }}"></i> {{ project.icon_class }}</td>
          <td>
            <a href="{{ url_for('admin_delete_project', id=project.id) }}" class="btn btn-sm btn-danger" onclick="return confirm('Delete this project?');">Delete</a>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>

<!-- Add Modal -->
<div class="modal fade" id="addProjectModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <form action="{{ url_for('admin_add_project') }}" method="POST" enctype="multipart/form-data">
        <div class="modal-header">
          <h5 class="modal-title">Add Project</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="mb-3">
            <label>Title</label>
            <input type="text" name="title" class="form-control" required>
          </div>
          <div class="mb-3">
            <label>Category (e.g. web, iot, ai)</label>
            <input type="text" name="category" class="form-control">
          </div>
          <div class="mb-3">
            <label>Date (e.g. April 2026)</label>
            <input type="text" name="date" class="form-control">
          </div>
          <div class="mb-3">
            <label>Icon Class (Bootstrap Icons e.g. bi-code)</label>
            <input type="text" name="icon_class" class="form-control" required>
          </div>
          <div class="mb-3">
            <label>Images (Multiple allowed)</label>
            <input type="file" name="images" class="form-control" multiple accept="image/*">
          </div>
          <div class="mb-3">
            <label>Description</label>
            <textarea name="description" class="form-control" rows="3" required></textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button type="submit" class="btn btn-primary">Save Project</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
